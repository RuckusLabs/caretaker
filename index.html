<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caretaker Check-In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sign in -->
  <main class="card" id="screen-signin">
    <div class="brand">
      <div class="icon">🌿</div>
      <div>
        <h1>Caretaker Check-In</h1>
      </div>
    </div>
    <p class="subtitle">Sign in to start your shift.</p>

    <label for="name">Name</label>
    <select id="name">
      <option value="" disabled selected>Loading...</option>
    </select>

    <div id="unlisted-fields" hidden>
      <label for="unlisted-name">Your name</label>
      <input type="text" id="unlisted-name" autocomplete="name" placeholder="Your name" />

      <label for="unlisted-rate">Your hourly rate ($)</label>
      <input
        type="number"
        id="unlisted-rate"
        inputmode="decimal"
        step="0.01"
        min="0"
        placeholder="20.00"
      />
    </div>

    <label for="phone">Phone number<span id="phone-hint"> (your PIN)</span></label>
    <input
      type="tel"
      id="phone"
      autocomplete="off"
      inputmode="tel"
      placeholder="(555) 555-1234"
      maxlength="14"
    />

    <button class="btn-primary" id="btn-signin" disabled>Sign In</button>
    <p class="error" id="signin-error"></p>
  </main>

  <!-- Active shift -->
  <main class="card" id="screen-active" hidden>
    <div class="brand">
      <div class="icon">🌿</div>
      <div>
        <h1>You're signed in</h1>
      </div>
    </div>
    <p class="subtitle" id="active-subtitle"></p>

    <div class="timer">
      <div class="elapsed" id="elapsed">00:00:00</div>
      <div class="shift-label" id="shift-label"></div>
    </div>

    <div id="checklist-container"></div>

    <div class="checklist-group">
      <h2>End of shift</h2>

      <div class="checklist-item" id="bm-row">
        <input type="checkbox" id="bm" />
        <label for="bm">Elsie had a bowel movement</label>
      </div>

      <label for="ate">How much did Elsie eat?</label>
      <select id="ate">
        <option value="">Not specified</option>
        <option value="some">Some</option>
        <option value="most">Most</option>
        <option value="all">All</option>
      </select>

      <label for="notes">Notes (anything notable during the shift)</label>
      <textarea
        id="notes"
        rows="4"
        placeholder="Optional — mood, incidents, anything the next caretaker or family should know..."
      ></textarea>
    </div>

    <button class="btn-danger" id="btn-signout">End Shift</button>
    <p class="error" id="active-error"></p>
  </main>

  <!-- Summary -->
  <main class="card" id="screen-summary" hidden>
    <div class="brand">
      <div class="icon">✅</div>
      <div>
        <h1>Shift complete</h1>
      </div>
    </div>
    <p class="subtitle">Thanks for your work!</p>

    <div class="summary-row">
      <span class="label">Hours worked</span>
      <span id="summary-hours"></span>
    </div>
    <div class="summary-row">
      <span class="label">Signed in</span>
      <span id="summary-signin"></span>
    </div>
    <div class="summary-row">
      <span class="label">Signed out</span>
      <span id="summary-signout"></span>
    </div>

    <div class="summary-row">
      <span class="label">Bowel movement</span>
      <span id="summary-bm"></span>
    </div>
    <div class="summary-row">
      <span class="label">Ate</span>
      <span id="summary-ate"></span>
    </div>

    <div class="checklist-group">
      <h2>Checklist completed</h2>
      <div id="summary-checklist"></div>
    </div>

    <div class="checklist-group" id="summary-notes-group" hidden>
      <h2>Notes</h2>
      <p id="summary-notes"></p>
    </div>

    <button class="btn-primary" id="btn-done">Done</button>
  </main>

  <!-- Double-confirm overlay -->
  <div class="confirm-overlay" id="confirm-overlay" hidden>
    <div class="confirm-box" id="confirm-box"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="checklists.js"></script>
  <script src="app.js"></script>
</body>
</html>
