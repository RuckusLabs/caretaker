<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caretaker Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Login -->
  <main class="card" id="screen-login">
    <div class="brand">
      <div class="icon">🌿</div>
      <div>
        <h1>Admin Login</h1>
      </div>
    </div>
    <p class="subtitle">Sign in to manage caretakers and view hours.</p>

    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username" placeholder="you@example.com" />

    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="Password" />

    <button class="btn-primary" id="btn-login">Sign In</button>
    <p class="error" id="login-error"></p>
  </main>

  <!-- Admin dashboard -->
  <main class="admin-shell" id="screen-admin" hidden>
    <div class="admin-header">
      <div class="brand">
        <div class="icon">🌿</div>
        <div>
          <h1>Caretaker Admin</h1>
        </div>
      </div>
      <button class="btn-secondary admin-logout" id="btn-logout">Log Out</button>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="allocation">Weekly Allocation</button>
      <button class="admin-tab" data-tab="caretakers">Caretakers</button>
    </div>

    <!-- Weekly allocation -->
    <section class="admin-panel" id="panel-allocation">
      <div class="admin-toolbar">
        <label for="range-start">From</label>
        <input type="date" id="range-start" />
        <label for="range-end">To</label>
        <input type="date" id="range-end" />
        <button class="btn-secondary" id="btn-this-week">This Week</button>
        <button class="btn-secondary" id="btn-last-week">Last Week</button>
        <button class="btn-primary" id="btn-load-range">Load</button>
      </div>
      <p class="error" id="allocation-error"></p>

      <div id="allocation-summary"></div>
      <div id="allocation-detail"></div>
    </section>

    <!-- Caretakers management -->
    <section class="admin-panel" id="panel-caretakers" hidden>
      <div id="caretakers-table"></div>

      <h2 class="admin-subheading">Add a caretaker</h2>
      <div class="admin-add-row">
        <input type="text" id="new-name" placeholder="Name" />
        <input type="tel" id="new-phone" placeholder="(555) 555-1234" maxlength="14" />
        <input type="number" id="new-rate" placeholder="Rate $/hr" step="0.01" min="0" />
        <button class="btn-primary" id="btn-add-caretaker">Add</button>
      </div>
      <p class="error" id="caretakers-error"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
